name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_DB: pulse_test, POSTGRES_USER: pulse, POSTGRES_PASSWORD: testpass}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U pulse -d pulse_test" --health-interval 5s --health-retries 15
    strategy:
      matrix: {database: [sqlite, postgres]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
        env: {ELECTRON_SKIP_BINARY_DOWNLOAD: "1"}
      - run: npm test
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://pulse:testpass@localhost:5432/pulse_test' || '' }}
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: {name: web-${{ matrix.database }}, path: dist}
